{% extends 'base.html' %}{% block content %}<h1>Customers</h1><form method="post" action="/customers/add"><input name="name" placeholder="Name" required><input name="email" placeholder="Email" required><input name="phone" placeholder="Phone"><input name="address" placeholder="Address"><button>Add Customer</button></form><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th></tr>{% for r in rows %}<tr><td>{{r.customer_id}}</td><td>{{r.name}}</td><td>{{r.email}}</td><td>{{r.phone}}</td><td>{{r.address}}</td></tr>{% endfor %}</table>{% endblock %}
