{% extends 'base.html' %}{% block content %}<h1>Products</h1><form method="post" action="/products/add"><input name="product_name" placeholder="Product" required><input name="price" type="number" step="0.01" placeholder="Price" required><input name="stock" type="number" placeholder="Stock" required><button>Add Product</button></form><table><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th></tr>{% for r in rows %}<tr><td>{{r.product_id}}</td><td>{{r.product_name}}</td><td>{{r.price}}</td><td>{{r.stock}}</td></tr>{% endfor %}</table>{% endblock %}
